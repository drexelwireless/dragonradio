- hosts: localhost
  connection: local
  roles:
    - lxd-create-container
  tasks:
    - name: Add host {{ container }}
      add_host:
        name: "{{ container }}"

- hosts: "{{ container }}"
  connection: lxd
  become: false
  roles:
    - role: update
      disable_ubuntu_advantage: true
    - base
    - dragonradio-base
    - accounts
    - colosseum-cli
    - role: mgen
      tag: "{{ mgen_version }}"
    - role: gpsd
      version: "{{ gpsd_version }}"
    - role: protobuf
      version: "{{ protobuf_version }}"
    - role: vivado2019.1-lab
      when: vivado | default(false) | bool
    - clean

- hosts: localhost
  connection: local
  roles:
    - role: lxd-export-container
      lxd_export_dir: ../../images
