- name: Stop ubuntu-advantage
  shell: systemctl stop ubuntu-advantage.service
  when: disable_ubuntu_advantage
  ignore_errors: true

- name: Disable ubuntu-advantage
  shell: systemctl disable ubuntu-advantage.service
  when: disable_ubuntu_advantage

- name: Update and upgrade apt packages
  block:
    - name: Wait for dpkg lock
      shell: while fuser /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 1; done;

    - name: Update and upgrade apt packages
      become: true
      apt:
        upgrade: 'yes'
        update_cache: yes
        autoremove: yes
  rescue:
    - include_tasks: main.yml
