- name: Install packages needed for protobuf {{version}}
  apt:
    state: present
    pkg:
      - autoconf
      - automake
      - curl
      - g++
      - libtool
      - make
      - ninja-build
      - unzip

- name: Fetch protobuf {{version}}
  unarchive:
    src: https://github.com/google/protobuf/releases/download/v{{version}}/protobuf-python-{{version}}.tar.gz
    dest: /tmp
    remote_src: yes
    extra_opts: --no-same-owner

- name: Create protobuf build directory
  file:
    state: directory
    path: /tmp/protobuf-{{version}}/build

- name: Build and install protobuf {{version}}
  shell: "{{item}}"
  args:
    chdir: /tmp/protobuf-{{version}}/build
  with_items:
    - cmake -G Ninja ../cmake
    - ninja install
    - ldconfig

- name: Remove protobuf {{version}} leftovers
  file:
    state: absent
    path: /tmp/{{item}}
  with_items:
    - /tmp/protobuf-{{version}}
