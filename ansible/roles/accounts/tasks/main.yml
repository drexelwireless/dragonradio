- name: Create srn-user group
  group:
    name: srn-user
    gid: "{{ srn_user_gid }}"

- name: Create srn-user user
  user:
    name: srn-user
    uid: "{{ srn_user_uid }}"
    password: "{{ srn_user_password | password_hash }}"
    group: srn-user
    groups: sudo

- name: Remove the ubuntu user
  user:
    name: user
    state: absent
    remove: yes
  when: remove_ubuntu_user

- name: Change root password
  user:
    name: root
    password: "{{ root_password | password_hash }}"

- name: Allow password authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication '
    line: PasswordAuthentication yes

- name: Allow password authentication for root
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin '
    line: PermitRootLogin yes
