[project]
name = "dragonradio"
description = "Python support for DragonRadio"
authors = [
    {name = "Geoffrey Mainland", email = "mainland@drexel.edu"},
]
requires-python = ">=3.8"
dynamic = ["version"]
dependencies = [
    "h5py",
    "importlib_resources",
    "ipykernel",
    "ipython",
    "libconf",
    "netifaces",
    "numpy",
    "pandas",
    "protobuf",
    "psutil",
    "python-daemon",
    "pyyaml",
    "pyzmq",
    "scipy"
]

[project.urls]
homepage = "https://github.com/drexelwireless/dragonradio"

[build-system]
requires = [
    "setuptools>=45",
    "setuptools_scm[toml]>=6.2",
    "wheel"
]

build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true
script-files = ["scripts/dragonradio-client"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v*[0-9]*",
]
root = "../.."
write_to = "python/dragonradio/src/dragonradio/radio/version.py"
